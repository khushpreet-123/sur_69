
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jot ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: #ffffff;
    border: 2px solid #c5a77e;
    border-radius: 24px;
    color: #29211d;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    text-align: center;
}

.container {
    width: 100%;
    max-width: none;
    min-height: calc(100svh - 4px);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 26px 20px;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
}

.heart {
    font-size: 32px;
    margin-bottom: 13px;
    color: #ad895c;
}

.small {
    font-size: 10px;
    letter-spacing: 3px;
    color: #9b7956;
    text-transform: uppercase;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(36px, 10vw, 46px);
    color: #392d27;
    margin: 12px 0;
    overflow-wrap: break-word;
}

.message {
    font-size: 13px;
    line-height: 1.65;
    color: #65564c;
    margin: 10px 0 19px;
}

button {
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    background: #29211d;
    color: #fffaf5;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    cursor: pointer;
}

.footer {
    margin-top: 19px;
    font-family: 'Dancing Script', cursive;
    font-size: 19px;
    color: #a17b50;
}

.container {
    animation: appear 1.5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

body::before {
    content: "♡";
    position: fixed;
    top: 12%;
    left: 7%;
    font-size: 30px;
    color: #c5a77e;
    animation: float 4s ease-in-out infinite;
}

body::after {
    content: "✦";
    position: fixed;
    bottom: 12%;
    right: 8%;
    font-size: 25px;
    color: #c5a77e;
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-18px);
    }
}

img {
    max-width: 100%;
    height: auto;
}

@media (max-width: 380px) {
    .container {
        padding: 23px 16px;
    }

    .message {
        font-size: 12px;
    }
}

.cake-wrap {
    position: relative;
    width: 100%;
    max-width: 220px;
    margin: 14px auto;
}

.cake-wrap img {
    width: 100%;
    display: block;
}

/* Candle smoke effect */
#candleSmoke {
    position: absolute;
    left: 50%;
    top: 18%;
    width: 13px;
    height: 28px;
    border-radius: 50%;
    background: rgba(110, 100, 92, 0.55);
    filter: blur(4px);
    opacity: 0;
    pointer-events: none;
}

#candleSmoke::before,
#candleSmoke::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 25px;
    border-radius: 50%;
    background: rgba(130, 120, 112, 0.45);
    filter: blur(4px);
}

#candleSmoke::before {
    left: -8px;
    top: -8px;
}

#candleSmoke::after {
    left: 7px;
    top: -15px;
}

#candleSmoke.show {
    animation: smokeRise 2.5s ease-out forwards;
}

@keyframes smokeRise {
    0% {
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.6);
    }

    35% {
        opacity: 0.9;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -55px) scale(1.5);
    }
}

.next-arrow {
    width: 42px;
    height: 42px;
    padding: 0;
    margin-top: 12px;
    border-radius: 50%;
    background: #c5a77e;
    color: white;
    font-size: 23px;
    box-shadow: 0 0 12px rgba(197, 167, 126, 0.5);
    animation: arrowGlow 1.8s ease-in-out infinite;
}

@keyframes arrowGlow {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 8px rgba(197, 167, 126, 0.4);
    }
    50% {
        transform: scale(1.1);
        box-shadow: 0 0 18px rgba(197, 167, 126, 0.8);
    }
}

.photo-gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.photo-gallery img {
    width: 100%;
    height: 125px;
    object-fit: cover;
    border-radius: 14px;
}

.photo-gallery img:first-child {
    grid-column: span 2;
    height: 180px;
}
</style>
</head>

<body>

    <div class="container">

        <div class="heart">♡</div>

        <p class="small">A little surprise for someone special</p>

        <h1>Happy Birthday, Jot!</h1>

        <p class="message">
            Today is all about you.<br>
            I have made something special for you.
        </p>

        <button onclick="showSurprise()">
            Open Your Surprise ♡
        </button>

        <div class="footer">With love, just for you ♡</div>

    </div>

<script>
function showSurprise() {
    document.querySelector(".container").innerHTML = `
        <h1>Wait, my Bugdi... ♡</h1>

        <p class="message">
            Before you explore this little surprise,
            I want you to know how special you are to me. ❤️
        </p>

        <button onclick="nextSurprise()">
            Continue ♡
        </button>
    `;
}

function nextSurprise() {
    document.querySelector(".container").innerHTML = `
        <div class="heart">♡</div>

        <p class="small">Something from my heart</p>

        <h1>And there's something I want you to know...</h1>

        <p class="message">
            You hold a very special place in my heart.
            I'm grateful for every little moment,
            every conversation, and every memory we share.

            <br><br>

            You make my world a little brighter
            just by being in it. ❤️
        </p>

        <button onclick="fourthScreen()">
            Continue ♡
        </button>

        <div class="footer">With love, just for you ♡</div>
    `;
}

function fourthScreen() {
    document.querySelector(".container").innerHTML = `
        <div class="heart">✦</div>

        <p class="small">A LITTLE BIRTHDAY MAGIC</p>

        <h1>Make a Wish, Jot!</h1>

        <div class="cake-wrap">
            <img id="cakeImage"
                 src="cake.png"
                 alt="Birthday Cake for Jot"
                 style="width:100%; max-width:220px; height:auto; margin:14px auto; border-radius:15px; display:block;">

            <span id="candleSmoke"></span>
        </div>

        <p class="message">
            May this year be filled with beautiful moments, endless smiles, and dreams coming true.

            <br><br>

            You deserve all the happiness in the world. ❤️
        </p>

        <button onclick="makeWish()">
            Make a Wish ♡
        </button>

        <div class="footer">A day as special as you are ♡</div>
    `;
}

function makeWish() {
    const cake = document.getElementById("cakeImage");
    const smoke = document.getElementById("candleSmoke");
    const button = document.querySelector(".container button");

    cake.src = "cake-unlit.png";

    smoke.classList.add("show");

    button.disabled = true;
    button.innerText = "Wish Made! ♡";

    button.insertAdjacentHTML("afterend", `
        <p class="message" style="margin-top:18px;">
            Wish Made, My Bugdi! ❤️
        </p>

        <button class="next-arrow" onclick="nextScreen()">→</button>
    `);
}

function nextScreen() {
    document.querySelector(".container").innerHTML = `
        <div class="photo-gallery">
            <img src="photo1.jpg" alt="Memory 1">
            <img src="photo2.jpg" alt="Memory 2">
            <img src="photo3.jpg" alt="Memory 3">
            <img src="photo4.jpg" alt="Memory 4">
            <img src="photo5.jpg" alt="Memory 5">
            <img src="photo6.jpg" alt="Memory 6">
        </div>
    `;
}
</script>
</body>
</html>
